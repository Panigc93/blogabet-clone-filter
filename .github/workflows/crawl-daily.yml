name: Crawl Daily (last month)

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:        # allow manual trigger

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run crawler
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          BLOGABET_COOKIE: ${{ secrets.BLOGABET_COOKIE }}
          LAST_ACTIVE: '1'
        run: |
          for i in 1 2 3; do
            if npx tsx crawler/crawl.ts; then
              exit 0
            fi

            if [ "$i" -lt 3 ]; then
              echo "Intento $i fallo; reintentando en 60 segundos..."
              sleep 60
            fi
          done

          echo "El crawler fallo despues de 3 intentos."
          exit 1

      - name: Run stats crawler
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          BLOGABET_COOKIE: ${{ secrets.BLOGABET_COOKIE }}
        run: |
          for i in 1 2 3; do
            npx tsx crawler/stats.ts && break
            echo "Intento $i fallo, reintentando en 30s..."
            sleep 30
          done