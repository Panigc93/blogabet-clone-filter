name: Crawl Daily (last month)

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:        # allow manual trigger

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run crawler
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          BLOGABET_COOKIE: ${{ secrets.BLOGABET_COOKIE }}
          LAST_ACTIVE: '1'
        run: |
          # One run, no outer retry loop (requests already retry inside, see CRAWL_MAX_ATTEMPTS).
          npx tsx crawler/crawl.ts

      - name: Run stats crawler
        if: ${{ !cancelled() }}  # stats are public per blog and use stored slugs: run even if the catalog step failed
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          BLOGABET_COOKIE: ${{ secrets.BLOGABET_COOKIE }}
        run: |
          # One run: the exit code must reach the job (the old loop ended in sleep and hid failures).
          npx tsx crawler/stats.ts
